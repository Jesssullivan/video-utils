# pnpm 11 reads package-manager settings from this file (not .npmrc).
# This site is its own workspace root so it never joins a parent workspace.
packages:
  - .
strictPeerDependencies: true
# Fail instead of silently running an (online) install when a script finds stale deps.
verifyDepsBeforeRun: error
# Required by rules_js for pnpm 11 (S3 bazel_full //site); an empty map allows no build scripts.
allowBuilds: {}
