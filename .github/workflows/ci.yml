name: Private offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Python and synthetic media checks
        run: nix develop --no-write-lock-file --command just check
      - name: Rust checks on the supported hosted builder
        run: nix develop --no-write-lock-file --command just test-rust
      - name: Secret scan
        run: nix develop --no-write-lock-file --command gitleaks dir --redact .
      # No private recording acquisition, media upload or model downloads in CI.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install web dependencies from the committed lock
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm install --frozen-lockfile'
      - name: Type check, unit tests and build
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm run check && pnpm run test:unit && pnpm run build'
      # Browser suites use the runner's installed Chrome (tests/browser-ladder.ts step c); nothing is downloaded.
      - name: End-to-end tests
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm run test:e2e'
      - name: Accessibility scans
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm run test:a11y'
  bazel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      # Optional warm cache (root pins the action SHA; the lane does not resolve it):
      # - uses: actions/cache@<sha> # v4
      #   with:
      #     path: |
      #       ~/.cache/bazel-video-utils
      #       ~/.cache/bazel/_bazel_runner/cache/repos
      #     key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'web/pnpm-lock.yaml', 'site/pnpm-lock.yaml') }}
      #     restore-keys: bazel-${{ runner.os }}-
      - name: Structural graph contract (no Bazel needed)
        run: PYTHONPATH=tests python3 -m unittest test_bazel_graph_s3 -v
      - name: Module graph and lock
        run: |
          python3 tools/bazel/run.py --timeout 900 mod graph > /dev/null
          python3 tools/bazel/run.py --timeout 900 build --nobuild //... --lockfile_mode=error
      - name: Full Bazel test run without host-tool modules
        run: >-
          nix develop --no-write-lock-file --command bash -c
          'python3 tools/bazel/run.py --timeout 4800 test //...
          --jobs=4 --local_resources=cpu=4 --keep_going
          --test_tag_filters=-requires-host-tools
          --test_env=FFMPEG="$(command -v ffmpeg)" --test_env=FFPROBE="$(command -v ffprobe)"
          --test_output=errors --test_summary=detailed'
