name: Private offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Python and synthetic media checks
        run: nix develop --no-write-lock-file --command just check
      # Narration types: dhall type and format, example renders against the committed JSON, fixture digests
      # and the models.json v2 drafts. Offline; no weights, voices or clips.
      - name: Narrate Dhall types and rendered examples
        run: nix develop --no-write-lock-file --command just narrate-dhall-check
      - name: Rust checks on the supported hosted builder
        run: nix develop --no-write-lock-file --command just test-rust
      - name: Secret scan
        run: nix develop --no-write-lock-file --command gitleaks dir --redact .
      # No private recording acquisition, media upload or model downloads in CI.
  condense:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      # Synthetic media only: no recording, no transcript and no whisper model in CI.
      - name: Talk condensing lint and tests
        run: nix develop --no-write-lock-file .#condense --command just cli condense-lint condense-test
      # The condense stage tools end to end through tool_api: this shell has the worker's numpy and FFmpeg.
      - name: Condense stage tool admission
        run: nix develop --no-write-lock-file .#condense --command bash -c 'cd tests && python3 -m unittest -v test_s4b_tool_admission'
  narrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      # Synthetic fixtures only: the fake engine and FFmpeg make every take. No voice, model, whisper model,
      # lexical release or network in CI; WER and SIM record not_measured.
      - name: Narration lint and tests
        run: nix develop --no-write-lock-file .#condense --command just narrate-lint narrate-test
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install web dependencies from the committed lock
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm install --frozen-lockfile'
      - name: Type check, unit tests and build
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm run check && pnpm run test:unit && pnpm run build'
      # Browser suites use the runner's installed Chrome (tests/browser-ladder.ts step c); nothing is downloaded.
      - name: End-to-end tests
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm run test:e2e'
      - name: Accessibility scans
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd web && pnpm run test:a11y'
  # Public static site (TIN-5723; site/DEPLOY.md gates 1 to 9). Verification only: this job never deploys,
  # holds no credential and fetches no browser. Deploying needs a separate operator go.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install site dependencies from the committed lock
        run: >-
          nix develop --no-write-lock-file .#web --command bash -c
          'cd site && pnpm install --frozen-lockfile && git diff --exit-code -- pnpm-lock.yaml'
      # The in-house packages are Bazel registry modules (RU9); the runner's bazelisk builds them at their pins.
      - name: Materialise the in-house packages
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd site && node scripts/inhouse-link.mjs'
      # The install and inhouse-link's Bazel run must leave every tracked file as committed, MODULE.bazel.lock
      # included (TIN-6577: the committed lock carries the digest Bazel computes, so the link is lock-neutral).
      - name: Tracked-file drift after the in-house link
        run: |
          git diff --stat
          if ! git diff --quiet; then
            git diff -- MODULE.bazel.lock
            echo "tracked files changed by install or inhouse-link: $(git diff --name-only | tr '\n' ' ')" >&2
            exit 1
          fi
      - name: Type check and build
        run: nix develop --no-write-lock-file .#web --command bash -c 'cd site && pnpm run check && pnpm run build'
      - name: Leak scans (build, source, vendor)
        run: >-
          nix develop --no-write-lock-file .#web --command bash -c
          'cd site && node scripts/leak-scan.mjs build
          && node scripts/leak-scan.mjs . --surface source
          && node scripts/leak-scan.mjs node_modules/@xoxd --surface vendor'
      # python3 and gitleaks come from the flake-locked nixpkgs (the same store paths as the default dev shell)
      # without evaluating the whole default shell; .#web supplies node, pnpm, just and git.
      - name: Pinned test tools
        run: |
          py="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#python3)"
          gl="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#gitleaks)"
          echo "SITE_TOOLS_PATH=$py/bin:$gl/bin" >> "$GITHUB_ENV"
          "$py/bin/python3" --version
          "$gl/bin/gitleaks" version
      # Rebuilds once, then the link check, privacy scan, gitleaks with its positive control and the browser
      # suite (smoke and axe) on a browser found by the ladder in site/e2e (installed Chrome is expected on the
      # runner). Fails closed: the run must end in OK and every reported skip must be the allowlisted
      # private-hostname skip, so a skipped browser suite, gitleaks or build class (or any new skip) fails.
      - name: Site tests
        run: |
          set -o pipefail
          export SITE_VERIFY_BROWSER=1 SITE_VERIFY_OUT_DIR="$RUNNER_TEMP/site-verify"
          log="$RUNNER_TEMP/site-tests.log"
          mkdir -p "$SITE_VERIFY_OUT_DIR"
          nix develop --no-write-lock-file .#web --command bash -c \
            'PATH="$SITE_TOOLS_PATH:$PATH" PYTHONPATH=tests python3 -m unittest test_public_site_s3 -v' \
            2>&1 | tee "$log"
          last="$(tail -n 1 "$log")"
          if ! printf '%s\n' "$last" | grep -Eqx 'OK( \(skipped=[0-9]+\))?'; then
            echo "unexpected final line: $last" >&2
            exit 1
          fi
          reported="$(printf '%s\n' "$last" | sed -nE 's/^OK \(skipped=([0-9]+)\)$/\1/p')"
          allowed="$(grep -cE "skipped 'private app hostname is null in deploy/cloudflare" "$log" || true)"
          if [ "${reported:-0}" != "$allowed" ]; then
            echo "skips reported: ${reported:-0}; allowlisted private-hostname skips: $allowed" >&2
            grep -E "skipped '" "$log" >&2 || true
            exit 1
          fi
      - name: Browser summary (V1 to V7, ladder step)
        if: always()
        run: |
          summary="$RUNNER_TEMP/site-verify/browser-summary.json"
          if [ ! -f "$summary" ]; then echo "no browser-summary.json was written"; exit 0; fi
          PATH="$SITE_TOOLS_PATH:$PATH" python3 -I - "$summary" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in ("skip_code", "browser_ladder_step", "browser_source", "browser_version", "playwright_version",
                      "axe_version", "browser_download_bytes", "external_requests_observed"):
              print(f"{key}: {s.get(key)}")
          sm, sl, a = s.get("smoke", {}), s.get("skip_link", {}), s.get("a11y", {})
          print(f"smoke: {sm.get('cases_passed')}/{sm.get('cases_expected')} passed, console_errors {sm.get('console_errors')}, "
                f"page_errors {sm.get('page_errors')}, max_overflow_px {sm.get('max_overflow_px')}")
          print(f"skip_link: {sl.get('passed')}/{sl.get('expected')}")
          print(f"axe: {a.get('scans_executed')}/{a.get('scans_expected')} scans, mode_assertion {a.get('mode_assertion_held')}, "
                f"violations {a.get('violations_total')}, incomplete {a.get('incomplete_total')} ({a.get('incomplete_rules')})")
          for key, m in sorted((s.get("metrics") or {}).items()):
              print(f"{key}: {m.get('numerator')}/{m.get('denominator')} pass={m.get('pass')}")
          PY
      - name: Deploy recipe still refuses
        run: |
          set +e
          nix develop --no-write-lock-file .#web --command just site-pages-deploy
          status=$?
          test "$status" -eq 2
  # Blocking since S4 (TIN-5722): three green runs at one head before the switch
  # (docs/agent-notes/2026-10-15-l7-bazel.md).
  bazel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      # Optional warm cache (root pins the action SHA; the lane does not resolve it):
      # - uses: actions/cache@<sha> # v4
      #   with:
      #     path: |
      #       ~/.cache/bazel-video-utils
      #       ~/.cache/bazel/_bazel_runner/cache/repos
      #     key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'web/pnpm-lock.yaml', 'site/pnpm-lock.yaml') }}
      #     restore-keys: bazel-${{ runner.os }}-
      - name: Structural graph contract (no Bazel needed)
        run: PYTHONPATH=tests python3 -m unittest test_bazel_graph_s3 -v
      - name: Module graph and lock
        run: |
          python3 tools/bazel/run.py --timeout 900 mod graph --lockfile_mode=error > /dev/null
          python3 tools/bazel/run.py --timeout 900 build --nobuild //... --lockfile_mode=error
      - name: Full Bazel test run without host-tool modules
        run: >-
          nix develop --no-write-lock-file --command bash -c
          'python3 tools/bazel/run.py --timeout 4800 test //...
          --jobs=4 --local_resources=cpu=4 --keep_going
          --test_tag_filters=-requires-host-tools
          --test_env=FFMPEG="$(command -v ffmpeg)" --test_env=FFPROBE="$(command -v ffprobe)"
          --test_output=errors --test_summary=detailed'
